<title>KS Check Key</title>
<style>
:root{--bg:#080b14;--panel:#111827;--line:#263247;--text:#edf3ff;--muted:#9ba9c2;--accent:#6d5dfc;--green:#34d399}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#172044 0,#080b14 58%);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--text);display:flex;align-items:center;justify-content:center;padding:22px}
.wrap{width:min(100%,480px)}.brand{display:flex;align-items:center;gap:12px;margin-bottom:22px}.logo{cursor:pointer;touch-action:manipulation;width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,#8075ff,#4a35d6);display:grid;place-items:center;font-weight:900;font-size:18px;box-shadow:0 8px 28px #5145cd55}.brand b{font-size:18px;letter-spacing:.4px;color:#ff0000;opacity:.38}.brand small{display:block;color:#ff0000;opacity:.38;margin-top:2px}
.card{background:#101625ed;border:1px solid var(--line);border-radius:22px;padding:26px;box-shadow:0 22px 70px #0006}.eyebrow{font-size:11px;color:#a99fff;font-weight:800;letter-spacing:2px;text-transform:uppercase}.card h1{font-size:27px;margin:9px 0 7px}.desc{color:var(--muted);font-size:14px;line-height:1.6;margin:0 0 22px}
label{display:block;font-size:13px;color:#dbe5fa;font-weight:650;margin:15px 0 8px}input,textarea{width:100%;background:#090e1a;border:1px solid #2c3850;border-radius:11px;padding:13px 14px;color:var(--text);font:inherit;outline:none}input:focus,textarea:focus{border-color:#8075ff;box-shadow:0 0 0 3px #8075ff20}button{border:0;border-radius:11px;padding:13px 15px;font:inherit;font-weight:750;cursor:pointer;transition:.15s}button:active{transform:scale(.99)}.primary{background:linear-gradient(135deg,#8175ff,#5c49e8);color:white;width:100%;margin-top:16px}.secondary{background:#202b40;color:#dce6fb}.row{display:flex;gap:9px}.row input{min-width:0}.row button{white-space:nowrap}.notice{font-size:13px;margin-top:13px;min-height:20px;color:var(--green)}.foot{color:#74829b;text-align:center;font-size:11px;margin:17px 0 0;line-height:1.6}.admin{margin-top:15px;text-align:center}.linkbtn{background:none;color:#9faed0;padding:8px;font-size:12px}.hidden{display:none!important}.adminbox{margin-top:18px;padding-top:18px;border-top:1px solid var(--line)}.keylist{margin-top:14px;display:grid;gap:8px}.keyitem{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#0b1120;font-size:13px;overflow-wrap:anywhere}.keyitem button{padding:6px 9px;font-size:11px}.pill{display:inline-block;background:#163c35;color:#70f0c4;border-radius:99px;padding:4px 8px;font-size:10px;margin-top:4px}
</style>

AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAP/Z') !important;

<body>
<main class="wrap">
  <div class="brand"><button class="logo" id="ksButton" type="button" aria-label="KS" title="KS">KS</button><div><b>KS GETKEY</b><small>Key access portal</small></div></div>
  <section class="card">
    <div class="eyebrow">Access system</div>
    <h1>Get your key</h1>
    <p class="desc">Masukkan key akses yang diberikan admin untuk memeriksa apakah key tersebut valid.</p>
    <label for="keyInput">Access key</label>
    <input id="keyInput" placeholder="Masukkan key kamu..." autocomplete="off">
    <button class="primary" id="checkBtn">Periksa Key</button>
    <div class="notice" id="result" role="status"></div>
    <div class="adminbox hidden" id="adminBox">
      <div class="eyebrow">Admin settings</div>
      <p class="desc" style="margin-top:8px">Masuk untuk menambah atau menghapus key.</p>
      <div id="loginArea">
        <input id="adminPass" type="password" placeholder="••••••••" aria-label="Kode akses" autocomplete="current-password">
        <button class="secondary" id="loginBtn" style="width:100%;margin-top:10px">Masuk Admin</button>
      </div>
      <div id="manageArea" class="hidden">
        <label for="newKey">Key baru</label>
        <div class="row"><input id="newKey" placeholder="Contoh: KS-ABCD-1234"><button class="secondary" id="addBtn">Tambah</button></div>
        <div class="row" style="margin-top:9px">
          <button class="secondary" id="generateBtn" style="flex:1">Buat key acak</button>
          <button class="secondary" id="logoutBtn">Keluar</button>
        </div>
        <label>Daftar key</label>
        <div id="keyList" class="keylist"></div>
      </div>
      <div class="notice" id="adminResult" role="status"></div>
    </div>
  </section>
  <p class="foot">Demo front-end • Data key disimpan di browser ini saja.</p>
</main>
<script>
/* Demo front-end; pemeriksaan ini bukan pengamanan server. */
const ADMIN_PASSWORD = "ks-ganteng";
const STORAGE_KEY = "ks_getkey_demo_keys_v1";
const DEFAULT_KEYS = ["KS-DEMO-2026"];
const $ = id => document.getElementById(id);
let isAdmin = false;
function getKeys(){try{const x=JSON.parse(localStorage.getItem(STORAGE_KEY));return Array.isArray(x)?x:DEFAULT_KEYS.slice()}catch{return DEFAULT_KEYS.slice()}}
function saveKeys(keys){localStorage.setItem(STORAGE_KEY,JSON.stringify([...new Set(keys.map(k=>k.trim()).filter(Boolean))]))}
function showResult(msg,ok){$("result").textContent=msg;$("result").style.color=ok?"var(--green)":"#fda4af"}
function checkKey(){const val=$("keyInput").value.trim();if(!val){showResult("Masukkan key terlebih dahulu.",false);return}const valid=getKeys().some(k=>k.toLowerCase()===val.toLowerCase());showResult(valid?"✓ Key valid! Akses diterima.":"✕ Key tidak valid atau belum terdaftar.",valid)}
$("checkBtn").addEventListener("click",checkKey);
$("keyInput").addEventListener("keydown",e=>{if(e.key==="Enter")checkKey()});
$("ksButton").addEventListener("click",()=>{
  const panel=$("adminBox");
  panel.classList.toggle("hidden");
  if(!panel.classList.contains("hidden")) panel.scrollIntoView({behavior:"smooth",block:"nearest"});
});
$("loginBtn").addEventListener("click",()=>{if($("adminPass").value===ADMIN_PASSWORD){isAdmin=true;$("loginArea").classList.add("hidden");$("manageArea").classList.remove("hidden");$("adminResult").textContent="Berhasil masuk.";renderKeys()}else{$("adminResult").textContent="Kode akses tidak sesuai."}});
$("adminPass").addEventListener("keydown",e=>{if(e.key==="Enter")$("loginBtn").click()});
$("logoutBtn").addEventListener("click",()=>{isAdmin=false;$("loginArea").classList.remove("hidden");$("manageArea").classList.add("hidden");$("adminPass").value="";$("adminResult").textContent=""});
$("addBtn").addEventListener("click",()=>{if(!isAdmin)return;const k=$("newKey").value.trim();if(!k){$("adminResult").textContent="Isi key yang ingin ditambahkan.";return}const keys=getKeys();if(keys.some(x=>x.toLowerCase()===k.toLowerCase())){$("adminResult").textContent="Key tersebut sudah ada.";return}keys.push(k);saveKeys(keys);$("newKey").value="";$("adminResult").textContent="Key berhasil ditambahkan.";renderKeys()});
$("newKey").addEventListener("keydown",e=>{if(e.key==="Enter")$("addBtn").click()});
$("generateBtn").addEventListener("click",()=>{$("newKey").value="KS-"+Array.from(crypto.getRandomValues(new Uint8Array(6)),b=>b.toString(16).padStart(2,"0")).join("").toUpperCase().match(/.{1,4}/g).join("-")});
function renderKeys(){const list=$("keyList");list.replaceChildren();const keys=getKeys();if(!keys.length){list.textContent="Belum ada key.";return}keys.forEach(k=>{const item=document.createElement("div");item.className="keyitem";const name=document.createElement("span");name.textContent=k;const del=document.createElement("button");del.className="secondary";del.textContent="Hapus";del.addEventListener("click",()=>{saveKeys(getKeys().filter(x=>x!==k));renderKeys();$("adminResult").textContent="Key dihapus."});item.append(name,del);list.append(item)})}
if(!localStorage.getItem(STORAGE_KEY))saveKeys(DEFAULT_KEYS);
</script>
</body>
</html>
